name = "revisions-edn"
main = "worker.js"
compatibility_date = "2026-11-24"
workers_dev = true

# Visite automatique du site tous les 3 jours à 4 h 17 (UTC), en lecture seule
[triggers]
crons = ["17 4 */3 * *"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "DATA"
id = "320273ff18124f53ae80766357f22510"

# Le secret SYNC_KEY est défini dans Cloudflare (Paramètres → Variables et secrets) et n'est pas dans ce dépôt.
